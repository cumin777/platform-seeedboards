# USB CDC console
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_PRINTK=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="XIAO STM32C5 Full Feature"

# Keep the board's 1200-bps UF2 reset helper active on the CDC ACM interface.
CONFIG_UF2_DFU_RESET=y

# Peripheral features
CONFIG_ADC=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PWM=y
CONFIG_SENSOR=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_JESD216_API=y

# LSM6DS3TR-C uses the LSM6DSL-compatible driver.
CONFIG_LSM6DSL_ENABLE_TEMP=y
CONFIG_LSM6DSL_TRIGGER_OWN_THREAD=y
CONFIG_LSM6DSL_THREAD_STACK_SIZE=1024
CONFIG_LSM6DSL_THREAD_PRIORITY=10
CONFIG_LSM6DSL_ACCEL_ODR=0
CONFIG_LSM6DSL_ACCEL_FS=0
CONFIG_LSM6DSL_GYRO_ODR=0
CONFIG_LSM6DSL_GYRO_FS=0

# Reduce USB stack chatter on the CDC console.
CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
