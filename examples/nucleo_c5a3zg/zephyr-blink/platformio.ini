; PlatformIO Project Configuration File
;
; Nucleo C5A3ZG Validation Example
; Uses seeed-xiao-stm32c5 board definition (same MCU die: STM32C5A3)
; with overlay for nucleo pin mapping.
; UF2 bootloader: app starts at 0x08008000

[env:nucleo_c5a3zg]
platform = https://github.com/cumin777/platform-seeedboards.git#add_xiao_c5_support
framework = zephyr
board = seeed-xiao-stm32c5
monitor_speed = 115200
platform_packages = framework-zephyr@~3.40400.0
