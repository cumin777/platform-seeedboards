; TFLite Micro person_detection sample — Visual Wake Words person detection
; (Stage A, embedded 96x96 test images). GCC 14.2.1 + CMSIS-NN.
; NOTE: firmware (~470 KB) is large; may exceed the 449 KB MCUboot slot0.
; See adaptation doc Flash budget analysis.
[env:seeed-xiao-nrf54lm20a-npu]
platform = file:///home/seeed/workspace/nrf54lm20a_pio/platform-seeedboards
framework = zephyr
board = seeed-xiao-nrf54lm20a-npu
monitor_speed = 115200
platform_packages = platformio/toolchain-gccarmnoneeabi@1.140201.0
