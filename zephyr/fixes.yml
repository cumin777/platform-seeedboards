# =============================================================================
# zephyr/fixes.yml — registry of local fixes to the framework-zephyr package
#                   (single source of truth)
# =============================================================================
#
# builder/frameworks/zephyr_fixes.py reads this file and applies the
# registered fixes to the framework-zephyr package of the current board.
# Two levels of gating:
#   1) board/package gating: only the boards[<board.name>] section is taken
#      (not found = the board has no fixes; skip)
#   2) version gating:       only entries whose applies_to matches the current
#      Zephyr version are applied
#
# Directory conventions (source file locations; the board level is one layer
# inside patches/overrides):
#   patch    source file = zephyr/patches/<board>/<fix.path>
#   override source file = zephyr/overrides/<board>/<fix.path>
#   for overrides, <fix.path> is also the relative target path inside the
#   framework package (identical to target)
#
# Field reference:
#   id            stable identifier, used in logs
#   type          patch | override
#   path          patch: file name relative to patches/<board>/
#                 override: path relative to overrides/<board>/ (= target inside the framework package)
#   target        modified/overridden target file inside the framework package (relative to the framework root)
#   applies_to    list of Zephyr versions this fix applies to: exact versions
#                 (e.g. "4.4.0") or PEP 440 ranges (e.g. ">=4.4,<4.6")
#   upstream      link to the corresponding upstream PR/issue; check on upgrade
#                 whether it already landed (optional)
#   baseline_sha  sha256 of the upstream target file (overrides only, optional);
#                 verified before applying — a mismatch warns, guarding against
#                 silent regressions from whole-file replacement after a
#                 framework package upgrade
#   reason        short note on why this fix is needed
# =============================================================================

boards:
  xiao_nrf54lm20b:
    fixes:
      - id: grtc-arm-first-compare
        type: patch
        path: 0001-nrf-grtc-arm-first-compare-in-tickless-init.patch
        target: drivers/timer/nrf_grtc_timer.c
        applies_to: ["4.4.0"]
        upstream: "https://github.com/zephyrproject-rtos/zephyr/commit/1afedec05eafdc59fcd97802510602952fc9b44c"
        reason: >
          Backport of upstream 1afedec05eaf. In tickless mode the GRTC
          driver skips arming the first CC compare at init and relies on
          the kernel calling sys_clock_set_timeout(); the kernel only does
          that when a new timeout becomes the soon-list head, so with an
          empty soon side announce never starts and every k_sleep()
          latches forever. After any warm reset the app image comes up
          dead (no LED, no USB CDC) unless reset via pin/power. Not in
          any Zephyr release yet (main only, 4.4.0 is the latest).

      - id: grtc-warm-reset-syscounter-ealready
        type: patch
        path: 0002-nrf-grtc-tolerate-running-syscounter-after-warm-reset.patch
        target: drivers/timer/nrf_grtc_timer.c
        applies_to: ["4.4.0"]
        reason: >
          Local fix, no upstream counterpart. A warm reset
          (NVIC_SystemReset, e.g. the SMP reset after `pio run -t
          upload`) preserves the GRTC domain, so a SYSCOUNTER still
          running from the previous image makes
          nrfx_grtc_syscounter_start() return -EALREADY before the
          system clock channel is allocated; sys_clock_driver_init()
          then aborts, INTEN is never set and the system clock never
          ticks. Allocate the channel and continue instead. nrfx master
          behaves identically, so an nrfx upgrade does not replace this.

      - id: grtc-release-lfclk-before-uninit
        type: patch
        path: 0003-nrf-grtc-release-lfclk-before-grtc-uninit.patch
        target: drivers/timer/nrf_grtc_timer.c
        applies_to: ["4.4.0"]
        upstream: "https://github.com/zephyrproject-rtos/zephyr/commit/aad2c65d69e2341c3a3733e5647e8958c8b6f6c8"
        reason: >
          Backport of upstream aad2c65d69e (adapted: 4.4.0 has no
          CONFIG_CLOCK_CONTROL_NRF_COMMON branch). Release LFCLK before
          nrfx_grtc_uninit() in sys_clock_disable(), so the GRTC domain
          is left in a clean state for the next boot image.

      - id: grtc-seed-cc-value
        type: patch
        path: 0004-nrf-grtc-seed-cc-value-from-startup-counter.patch
        target: drivers/timer/nrf_grtc_timer.c
        applies_to: ["4.4.0"]
        reason: >
          Local fix, no upstream counterpart (upstream main is still
          affected). The SYSCOUNTER is not cleared at startup
          (zephyr#89147), so after a warm reset it keeps the value
          accumulated by previous images. Upstream PR#91432 (in 4.4.0)
          initializes last_count from the counter but leaves the static
          cc_value at 0; the tickless fast path (cc_value += cyc) assumes
          cc_value is seeded from the startup counter base. With the two
          bases torn apart, sys_clock_set_timeout() arms the compare ~2^32
          cycles out and the system clock never fires — the image comes up
          dead after every warm reset (verified via JLink: cc_value ends up
          2^32-32 cycles past last_count, CC6 armed far future, CPU stuck
          in idle). Seed cc_value from last_count at init.

  xiao_stm32c5:
    fixes:
      - id: adc-pcsel
        type: patch
        path: 0001-adc-stm32-fix-pcsel-channel-preselection.patch
        target: drivers/adc/adc_stm32.c
        applies_to: ["4.4.0"]
        reason: >
          The STM32 ADC driver uses the channel value converted by
          STM32_ADC_DECIMAL_NB_TO_CHANNEL as the PCSEL (channel preselection)
          bitmask; it should be BIT(channel_id). Multi-channel ADC configs
          misbehave.

      - id: udc-stm32-hal2
        type: override
        path: drivers/usb/udc/udc_stm32.c
        target: drivers/usb/udc/udc_stm32.c
        applies_to: ["4.4.0"]
        baseline_sha: "cce3ae86dfb457878053278f5b2a84e24b4135330b44bc2dc248e3db249565df"
        upstream: "https://github.com/zephyrproject-rtos/zephyr/pull/105957"
        reason: >
          Upstream udc_stm32.c in Zephyr 4.4.0 has no STM32C5 HAL2 USB
          support (PR#105957 landed after 4.4.0). This override is a
          whole-file copy of that PR's HAL2 dual-branch backported to 4.4.0;
          it is a hard dependency of XIAO STM32C5 USB CDC and the 1200-bps
          UF2 trigger.

      - id: flash-stm32-xspi-c
        type: override
        path: drivers/flash/flash_stm32_xspi.c
        target: drivers/flash/flash_stm32_xspi.c
        applies_to: ["4.4.0"]
        baseline_sha: "8cfca7e4af3a6b5f8e24900e90ff425702e912efecc1f3b42a36a39274c0b0c4"
        reason: >
          Upstream Zephyr 4.4.0 lacks STM32C5 XSPI flash driver support;
          this override is a whole-file copy carrying STM32C5 support, used
          by the XSPI1 external NOR flash (PY25Q128HA).

      - id: flash-stm32-xspi-h
        type: override
        path: drivers/flash/flash_stm32_xspi.h
        target: drivers/flash/flash_stm32_xspi.h
        applies_to: ["4.4.0"]
        baseline_sha: "0bf20f12282191169efeaa650549ffad3b168fc4b49a797d29f844da3adcf474"
        reason: Header for flash-stm32-xspi-c, overridden together with the driver.

      - id: cmake-gnu-ld-version-windows
        type: patch
        path: 0002-cmake-handle-gnu-ld-version-on-windows.patch
        target: cmake/modules/FindGnuLd.cmake
        applies_to: ["4.4.0"]
        reason: >
          PlatformIO's GNU Arm Embedded GCC 8 writes the ld.bfd --version
          output to stderr on Windows; Zephyr 4.4.0 only checks stdout and
          then calls string(REGEX) with an empty argument, failing the
          first CMake configure.
